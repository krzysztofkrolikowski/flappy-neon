name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check (ts)
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo 'No tsconfig.json, skipping type check.'
          fi
      - name: Lint
        run: |
          if [ -f .eslintrc.js ] || [ -f .eslintrc.json ] || [ -f .eslintrc ]; then
            npx eslint .
          else
            echo 'No ESLint config, skipping lint.'
          fi
      - name: Test
        run: |
          if [ -f vitest.config.js ] || [ -f vitest.config.ts ] || [ -f vitest.config.mjs ]; then
            npx vitest run
          else
            echo 'No Vitest config, skipping tests.'
          fi
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel --prod --confirm
